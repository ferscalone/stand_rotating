services:

  dashboard3:
    build:
      context: .
      dockerfile: Dockerfile

    container_name: dashboard3

    restart: unless-stopped

    ports:
      - "5180:80"

    environment:
      # Часовой пояс для времени в журналах и границ суток.
      LOG_TZ: "Europe/Moscow"
      # Канал управления освобождается сам, если владелец ничего не делает столько секунд.
      LOCK_IDLE_TIMEOUT_S: "600"
      # Сколько ждать владельца, закрывшего вкладку, прежде чем освободить канал.
      LOCK_DISCONNECT_GRACE_S: "45"
      # Сколько владелец может не отвечать на запрос управления (и ничего не делать).
      LOCK_REQUEST_TIMEOUT_S: "60"
      # Шаг записи телеметрии в журнал, мс (0 - не писать телеметрию).
      LOG_TELEMETRY_INTERVAL_MS: "1000"
      # Сколько дней хранить журналы (0 - бессрочно).
      LOG_RETENTION_DAYS: "180"
      # Регистратор: сервер сам подключается к стенду и пишет телеметрию и испытания,
      # даже когда панель никто не открыл (0 - выключить). Занимает 1 из 4 WS-подключений стенда.
      RECORDER: "1"
      # Стенды, которые писать всегда, через запятую (IP стенда; .local из контейнера не резолвится).
      # Кроме того, пишется любой стенд, который открыли в панели (RECORD_AUTO=0 - не надо).
      RECORD_HOSTS: ""
      RECORD_AUTO: "1"
      # Шаг записи кадров испытания, мс (0 - каждый кадр стенда, ~5 в секунду).
      RUN_SAMPLE_MS: "0"
      # Сколько дней хранить испытания (0 - всегда).
      RUN_RETENTION_DAYS: "0"
      # Реальных импульсов на оборот вала, если прошивка их не сообщает (деление 1/16).
      SHAFT_STEPS_PER_REV: "3200"

    volumes:
      # Журналы, испытания (logs/runs) и библиотека программ остаются на хосте.
      - ./logs:/app/logs
      - ./data:/app/data

    networks:
      # Общая сеть шлюза TMVOS: nginx ходит сюда по имени контейнера (http://dashboard3)
      # и публикует панель как http://tmvos.panel/rotate/ (см. README, раздел «Деплой»).
      - tmvos

networks:
  # Создаётся один раз командой: docker network create tmvos
  tmvos:
    external: true
