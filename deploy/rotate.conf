# Стенд вращения (dashboard3) -> http://tmvos.panel/rotate/
# Контейнер: dashboard3 (compose-проект stand_rotating/dashboard), порт внутри: 80.
# Положить рядом с bend.conf в mainpage/nginx/apps/ и перезагрузить nginx.

location = /rotate { return 301 /rotate/; }

location /rotate/ {
    set $rotate_upstream dashboard3:80;
    rewrite ^/rotate/(.*)$ /$1 break;
    proxy_pass http://$rotate_upstream;
}
